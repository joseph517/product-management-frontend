<div class="container">

  <!-- Product table -->
  <table class="table table-bordered table-striped" *ngIf="productList.length > 0">
    <thead class="thead-light">
      <tr>
        <th>Nombre</th>
        <th>Descripción</th>
        <th>Precio</th>
        <th>Fecha de Creación</th>
        <th class="text-center">Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let product of productList">
        <td>{{ product.name }}</td>
        <td>{{ product.description }}</td>
        <td>{{ product.price | currency }}</td>
        <td>{{ product.createdAt | date: 'short' }}</td>
        <td class="text-center">
          <p-button icon="pi pi-pencil" severity="info" size="small" [text]="true" class="me-2"
            (click)="prepareUpdate(product.id)"></p-button>
          <p-button icon="pi pi-trash" severity="danger" size="small" [text]="true"
            (click)="prepareDelete($event, product.id, product.name)"></p-button>
        </td>
      </tr>
    </tbody>
  </table>

  <!-- Pagination -->
  <nav *ngIf="totalPages > 1" aria-label="Paginación de productos">
    <ul class="pagination justify-content-center">

      <!-- Previous button -->
      <li class="page-item" [class.disabled]="currentPage === 1">
        <button class="page-link" (click)="changePage(currentPage - 1)" [disabled]="currentPage === 1">
          Anterior
        </button>
      </li>

      <!-- Page buttons -->
      <li class="page-item" *ngFor="let page of [].constructor(totalPages); let i = index"
        [class.active]="currentPage === i + 1">
        <button class="page-link" (click)="changePage(i + 1)">
          {{ i + 1 }}
        </button>
      </li>

      <!-- Next button -->
      <li class="page-item" [class.disabled]="currentPage === totalPages">
        <button class="page-link" (click)="changePage(currentPage + 1)" [disabled]="currentPage === totalPages">
          Siguiente
        </button>
      </li>

    </ul>
  </nav>

  <!-- Message if there are no products -->
  <div *ngIf="productList.length === 0">
    <div class="d-flex justify-content-center">
      <h1>No hay Registros</h1>
    </div>
  </div>

  <app-dialog class="card flex justify-content-center gap-2" [productName]="selectedProductName"
    (confirmed)="onDeleteConfirmed()">
  </app-dialog>

  <app-update-dialog class="card flex justify-content-center gap-2"></app-update-dialog>

</div>
