<div class="card flex justify-content-center">
    <p-dialog *ngIf="productToEdit" 
        [header]="'Actualizar Producto ' + productToEdit.name"
        [(visible)]="visible"
        [style]="{width: '50vw'}" [draggable]="false" [resizable]="false">
        <app-update-form 
            [productToEdit]="productToEdit"
            (productUpdated)="onUpdate($event)"
        ></app-update-form>
    </p-dialog>
</div>
